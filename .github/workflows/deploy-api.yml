name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

permissions:
  id-token: write   # requerido para OIDC — sin esto, no se puede asumir el rol de AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS (OIDC, sin keys guardadas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Empaquetar la API
        run: |
          cd api
          zip -r ../refugia-api.zip . -x "node_modules/*" -x ".env"

      - name: Definir version label
        id: version
        run: echo "label=v-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Subir el paquete a S3
        run: |
          aws s3 cp refugia-api.zip \
            s3://refugia-dev-fotos-animales/deploys/${{ steps.version.outputs.label }}.zip

      - name: Crear versión de aplicación en Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name refugia-dev \
            --version-label ${{ steps.version.outputs.label }} \
            --source-bundle S3Bucket=refugia-dev-fotos-animales,S3Key=deploys/${{ steps.version.outputs.label }}.zip

      - name: Actualizar el entorno
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name refugia-dev-env \
            --version-label ${{ steps.version.outputs.label }}

      - name: Esperar a que el entorno termine de actualizarse
        run: aws elasticbeanstalk wait environment-updated --environment-name refugia-dev-env
